<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аналітика демо</title><style>body{margin:0;background:#080d22;color:#f8faff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:34px 18px}h1{font-size:42px;margin:0 0 6px}.muted{color:#aeb7d6}.auth{display:flex;gap:8px;margin:25px 0}.auth input{flex:1;padding:12px;border-radius:12px;border:1px solid #303b68;background:#111936;color:white}.auth button{padding:12px 18px;border:0;border-radius:12px;background:#d7ff20;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#111936;border:1px solid #2a345c;border-radius:18px;padding:18px}.card strong{font-size:31px;display:block}.card span{color:#aeb7d6;font-size:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #2a345c}th{color:#d7ff20}.error{color:#ff655f}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main class="wrap"><p class="muted">ПІЛОТНА ВЕРСІЯ</p><h1>Аналітика демо</h1><p class="muted">Анонімні взаємодії та оцінки учасників.</p><div class="auth"><input id="token" type="password" placeholder="Токен адміністратора"><button id="load">Завантажити</button></div><p id="message"></p><section id="dashboard" hidden><div class="grid" id="metrics"></div><div class="cols"><div class="card"><h2>Середні оцінки</h2><table id="ratings"></table></div><div class="card"><h2>Популярні дії</h2><table id="events"></table></div></div><div class="cols"><div class="card"><h2>Екрани</h2><table id="screens"></table></div><div class="card"><h2>Готовність користуватися</h2><table id="wouldUse"></table></div></div></section></main><script>const $=s=>document.querySelector(s);const rows=o=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');$('#load').onclick=async()=>{const token=$('#token').value.trim();sessionStorage.setItem('mriia_admin_token',token);$('#message').textContent='Завантаження…';try{const r=await fetch(`api/stats.php?token=${encodeURIComponent(token)}`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Помилка');$('#metrics').innerHTML=[['Сесії',d.sessions],['Події',d.events_total],['Відгуки',d.feedback_total],['Реєстрації',d.demo_registrations]].map(x=>`<div class="card"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');$('#ratings').innerHTML='<tr><th>Показник</th><th>Середнє</th></tr>'+rows(d.ratings);$('#events').innerHTML='<tr><th>Дія</th><th>Кількість</th></tr>'+rows(d.event_counts);$('#screens').innerHTML='<tr><th>Екран</th><th>Перегляди</th></tr>'+rows(d.screen_views);$('#wouldUse').innerHTML='<tr><th>Відповідь</th><th>Кількість</th></tr>'+rows(d.would_use);$('#dashboard').hidden=false;$('#message').textContent=`Оновлено: ${new Date(d.generated_at).toLocaleString('uk-UA')}`;$('#message').className='muted'}catch(e){$('#message').textContent=e.message;$('#message').className='error'}};$('#token').value=sessionStorage.getItem('mriia_admin_token')||'';</script></body></html>
